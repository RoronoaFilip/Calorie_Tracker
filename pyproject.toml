[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "calorie-tracker"
version = "0.1.0"
description = "A private, local calorie and macro tracker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.8,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
relative_files = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]